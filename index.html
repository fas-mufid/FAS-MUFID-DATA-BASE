    Deux méthodes quand une MUFID envoie un fichier corrigé : <b>(recommandé)</b> réimporter son fichier en cochant « Synchroniser la MUFID » dans l’écran d’import — les absents sont retirés sans jamais vider la base ; ou <b>Vider</b> ci-dessus puis réimporter (repart de zéro pour cette MUFID).</div>`;
  $('#mAdd').onclick = ()=>{ if(!AC.gardien('mufid.gerer')) return; const n=prompt('Nom de la MUFID'); if(!n) return; const c=prompt('Code court','MUF'+(DB.mufids.length+1));
    DB.mufids.push({code:c||n.slice(0,6).toUpperCase(),nom:n}); sauver(true); rendMufids(); };
  $('#mXls').onclick = ()=>exportClassementXls();
  if($('#mClean')) $('#mClean').onclick = ()=>nettoyerMufidsVides();
  $$('#v-mufids [data-vider]').forEach(b=>b.onclick=()=>viderUneMufid(b.dataset.vider, b.dataset.nom, +b.dataset.nb));
  $$('#v-mufids [data-fas]').forEach(b=>b.onclick=async ()=>{ if(!AC.gardien('mufid.gerer')) return;
    const m = DB.mufids.find(x=>x.code===b.dataset.fas); if(!m) return;
    if(m.adhesionFas){ m.adhesionFas=false; m.dateAdhesionFas=null; journal('Adhésion FAS retirée', m.nom); }
    else { m.adhesionFas=true; m.dateAdhesionFas=auj(); journal('MUFID adhérée au FAS', m.nom); }
    try{ if(Cloud.session) await Cloud.pushMeta(DB); }catch(e){}
    await sauver(true); rendMufids();
  });
}
/* Retire du référentiel les MUFID qui ne comptent aucun adhérent (entrées fantômes : démo, doublons de code). */
async function nettoyerMufidsVides(){
  if(!AC.gardien('mufid.gerer')) return;
  const presentes = await mufidsPresentes(true);
  const codesPresents = new Set(presentes.map(m=>m.code));
  const vides = DB.mufids.filter(m=>!codesPresents.has(m.code));
  if(!vides.length){ toast('Aucune MUFID vide — le référentiel est déjà propre','ok'); return; }
  modale('Nettoyer les MUFID vides', `
    <div class="note"><b>${vides.length} MUFID sans aucun adhérent vont être retirées du référentiel :</b>
      ${vides.map(m=>esc(m.nom)+' <span class="disc">('+esc(m.code)+')</span>').join(' · ')}</div>
    <div class="note vert"><b>Sans risque</b> Seules les entrées vides disparaissent. Aucun adhérent n’est supprimé. Les MUFID actives sont conservées.</div>`,
    [{t:'Annuler'},{t:'Retirer ces '+vides.length+' MUFID vides', cl:'d', f:async ()=>{
      const avant = DB.mufids.length;
      DB.mufids = DB.mufids.filter(m=>codesPresents.has(m.code));
      // s'il ne reste rien (base totalement vide), garder au moins une entrée par défaut
      if(!DB.mufids.length) DB.mufids = presentes.length? presentes.map(m=>({code:m.code,nom:m.nom})) : [{code:'YDE',nom:'MUFID Yaoundé'}];
      journal('Nettoyage des MUFID vides', (avant-DB.mufids.length)+' retirée(s)');
      if(Cloud.session){ try{ await Cloud.pushMeta(DB); await Cloud.auditer('Nettoyage MUFID vides', (avant-DB.mufids.length)+' retirée(s)'); }catch(e){} }
      await sauver(true); MUFIDS_PRESENTES=null;
      toast((avant-DB.mufids.length)+' MUFID vide(s) retirée(s)','ok'); rendMufids();
    }}]);
}
function viderUneMufid(code, nom, nbAdh){
  if(!AC.gardien('reset')) return;
  modale('Vider la MUFID — '+nom, `<div class="note rouge"><b>Suppression de tous les adhérents de cette MUFID</b>
    Les ${nb(nbAdh)} adhérent(s) de « ${esc(nom)} » seront supprimés${Srv.actif()?' de la base centrale':''}. Les autres MUFID ne sont pas touchées.
    À utiliser avant de réimporter le fichier corrigé de cette caisse.</div>
    <div class="note"><b>Alternative sans risque</b> Plutôt que de vider, vous pouvez réimporter le fichier de cette MUFID en cochant « Synchroniser la MUFID » : les absents seront retirés automatiquement, sans vider la base.</div>`,
    [{t:'Annuler'},
     {t:'Vider cette MUFID', cl:'d', f:async ()=>{
       try{
         if(Srv.actif()){ await Srv.viderMufid(code); }
         else { DB.adherents = DB.adherents.filter(a=>a.mufid!==code); }
         journal('Vidage MUFID', nom+' ('+nb(nbAdh)+' adhérents)');
         if(Cloud.session) Cloud.auditer('Vidage MUFID', nom);
         await sauver(true); toast('MUFID « '+nom+' » vidée','ok');
         setTimeout(()=>modale('MUFID vidée', `<div class="note vert"><b>« ${esc(nom)} » est maintenant vide.</b>
           Rendez-vous dans « Importer des membres » pour charger son fichier corrigé.</div>`,
           [{t:'Fermer'},{t:'Aller à l’import', cl:'', f:()=>{ aller('import'); }}]), 200);
         if(Srv.actif()) await rafraichir(); else rendMufids();
       }catch(e){ toast('Échec : '+(e.message||e),'ko'); }
     }}]);
}

/* =====================================================================
   CONTRÔLE ET ANOMALIES — art. 12, 21, 24, 26, 27
   ===================================================================== */
function anomalies(){
  const ex = DB.params.exercice, P = DB.params, A = {listes:[]};
  const add = (code,titre,article,gravite,lignes)=>{ if(lignes.length) A.listes.push({code,titre,article,gravite,lignes}); };
  add('age',"Adhésions irrégulières : 60 ans ou plus à la date d'adhésion",'art. 12.1','ko',
    DB.adherents.filter(a=>!R.eligible(a)).map(a=>({t:R.nomComplet(a), d:`${age(a.dateNaissance,a.dateAdhesion)} ans à l'adhésion du ${jour(a.dateAdhesion)}`, id:a.id})));
  add('prov',"Comptes non provisionnés — couverture suspendue",'art. 12.3','ko',
    DB.adherents.filter(a=>a.categorie===3 && (a.solde||0)<P.provisionMin && !R.payee(a,ex)).map(a=>({t:R.nomComplet(a), d:`Solde ${fcfa(a.solde)} pour une provision requise de ${fcfa(P.provisionMin)}`, id:a.id})));
  add('act',"Comptes sans activité réelle — risque spéculatif",'art. 12.2','att',
    DB.adherents.filter(a=>{ if(a.categorie!==3||a.ancienMembre||!a.dateAdhesion) return false;
      return ex >= new Date(a.dateAdhesion).getFullYear()+1 && (a.mouvements||0) <= R.cotisationDue(a); })
      .map(a=>({t:R.nomComplet(a), d:`Mouvements de l'exercice : ${fcfa(a.mouvements)}`, id:a.id})));
  add('imp',"Cotisations "+ex+" non soldées",'art. 9','att',
    DB.adherents.filter(a=>a.statut!=='decede'&&a.statut!=='radie'&&!R.payee(a,ex)).map(a=>({t:R.nomComplet(a), d:`${fcfa(((R.cot(a,ex)||{}).paye)||0)} encaissés sur ${fcfa(R.cotisationDue(a))}`, id:a.id})));
  add('dbl',"Têtes assurées prélevées plusieurs fois",'art. 10.2','att',

/* Calcul des cotisations multiples (personnes cat.3 ayant cotisé dans plusieurs MUFID) */
async function calculCotisationsMultiples(){
  const ex = DB.params.exercice;
  if(Srv.actif()){
    const d = await Srv.cotisationsMultiples(ex);
    return (d && d.liste) ? d.liste.map(x=>({
      cle:x.cle, cotisations:x.cotisations, mufids:x.mufids, payeTotal:x.paye_total,
      aConserver:x.a_conserver, aRembourser:x.a_rembourser, details:(x.details||[])
    })) : [];
  }
  // mode local : regroupement par nom+prénom (TOUTES catégories), dès qu'une personne a plus d'une cotisation.
  // On conserve la cotisation la PLUS ÉLEVÉE (= capital décès le plus protecteur) et on rembourse les plus petites.
  const grp = {};
  DB.adherents.forEach(a=>{ const c=R.cot(a,ex); if(!c||!(c.paye>0)) return;
    const cle = norm((a.nom||'')+' '+(a.prenom||''));
    (grp[cle]=grp[cle]||[]).push({id:a.id, mufid:a.mufid, compte:a.compte, matricule:a.matricule,
      categorie:a.categorie, fonction:a.fonction, paye:c.paye, capital:R.capital(a)}); });
  return Object.entries(grp)
    .filter(([,v])=> v.length>1)                         // plus d'une cotisation = cas à traiter (même MUFID incluse)
    .map(([cle,v])=>{ const details=v.sort((x,y)=>y.paye-x.paye || y.capital-x.capital);  // la plus élevée d'abord
      const payeTotal=v.reduce((s,x)=>s+x.paye,0);
      const aConserver=details[0].paye;                  // on garde la plus grande cotisation
      return {cle, cotisations:v.length, mufids:new Set(v.map(x=>x.mufid)).size, payeTotal,
        aConserver, aRembourser: payeTotal - aConserver, capitalConserve: details[0].capital, details}; })
    .sort((a,b)=> b.aRembourser-a.aRembourser || b.cotisations-a.cotisations);
}

    <div class="note vert"><b>Non-cumul préservé</b> La personne reste couverte une seule fois (art. 17). Ce remboursement ne concerne que l’excédent de cotisations.</div>

    [{t:'Annuler'},{t:'Confirmer le remboursement', cl:'', f:async ()=>{
      DB.remboursements = DB.remboursements || {};
      DB.remboursements[x.cle] = {date:auj(), montant:x.aRembourser, garde:garde.mufid, ref:($('#rbRef')||{}).value||'', par:(Cloud.profil||{}).email||'local'};
      journal('Remboursement trop-perçu', x.cle+' — '+fcfa(x.aRembourser)+' ('+(x.cotisations-1)+' cotisation(s))');
      try{ if(Cloud.session){ await Cloud.pushMeta(DB); await Cloud.auditer('Remboursement trop-perçu', x.cle+' : '+fcfa(x.aRembourser)); } }catch(e){}
      await sauver(true); toast('Remboursement enregistré','ok'); rendCotisationsMultiples();
    }}]);
}
function exportCotisationsMultiples(liste){

async function lirePdf(file){
  if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const out = [];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p), tc = await page.getTextContent();
    const par = {};
    tc.items.forEach(it=>{ const y = Math.round(it.transform[5]);
      let cle = Object.keys(par).find(k=>Math.abs(k-y)<=3) || y; (par[cle]=par[cle]||[]).push({x:it.transform[4],s:it.str}); });
    Object.keys(par).sort((a,b)=>b-a).forEach(y=>{
      const items = par[y].sort((a,b)=>a.x-b.x), cells=[]; let cur='', lastX=null;
      items.forEach(i=>{ if(lastX!==null && i.x-lastX > 14){ cells.push(cur.trim()); cur=''; } cur += i.s; lastX = i.x + i.s.length*4.6; });
      if(cur.trim()) cells.push(cur.trim());
      if(cells.filter(Boolean).length>1) out.push(cells);
    });
  }
  return out;
}
/* Repère la ligne d'en-tête réelle (ignore titre du document, lignes vides, sous-titres).
   On note chaque ligne des 10 premières : +points si une cellule correspond à un indicateur connu. */
function trouverEntete(lignes){
  const tousInd = CHAMPS.flatMap(c=>c.ind);
  let best=0, bestScore=-1;
  const lim = Math.min(10, lignes.length);
  for(let i=0;i<lim;i++){
    const cells = lignes[i].map(x=>norm(x));
    const remplies = cells.filter(x=>x!=='').length;
    if(remplies<2) continue;                       // trop peu de colonnes : pas un en-tête
    let hits=0;
    cells.forEach(n=>{ if(n && tousInd.some(x=> n===x || (x.length>=4 && (n.includes(x)||x.includes(n))))) hits++; });
    // bonus si beaucoup de colonnes remplies et courtes (intitulés), malus si cellules longues (données/titre)
    const longMoy = cells.filter(x=>x).reduce((s,x)=>s+x.length,0)/Math.max(1,remplies);
    const score = hits*3 + remplies - (longMoy>25?3:0);
    if(score>bestScore){ bestScore=score; best=i; }
    if(hits>=3) { return i; }                       // en-tête évident trouvé
  }
  return best;
}
function autoMapper(){
  IMP.map = {};
  const pris = new Set();
  // 1er passage : égalité exacte (prioritaire — évite que "MUFID" soit pris par l'indicateur "id")
  IMP.entete.forEach((h,i)=>{ const n = norm(h); if(!n) return;
    const c = CHAMPS.find(c=> !pris.has(c.k) && c.ind.some(x=> n===x));
    if(c && IMP.map[c.k]===undefined){ IMP.map[c.k]=i; pris.add(c.k); }
  });
  // 2e passage : inclusion, mais seulement pour les indicateurs d'au moins 4 lettres (pas "id", "cat"…)
  IMP.entete.forEach((h,i)=>{ const n = norm(h); if(!n || Object.values(IMP.map).includes(i)) return;
    const c = CHAMPS.find(c=> !pris.has(c.k) && c.ind.some(x=> x.length>=4 && (n.includes(x)||x.includes(n))));
    if(c && IMP.map[c.k]===undefined){ IMP.map[c.k]=i; pris.add(c.k); }
  });
}

function valeurLigne(r, k){ const i = IMP.map[k]; return i==null? '' : String(r[i]==null?'':r[i]).trim(); }
function versDate(v){
  if(!v) return null;
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let an=+m[3]; if(an<100) an += an>40?1900:2000; return `${an}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`; }
  m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m) return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  if(/^\d{5}$/.test(s)){ const d = new Date(Date.UTC(1899,11,30)+ (+s)*86400000); return d.toISOString().slice(0,10); }
  const d = new Date(s); return isNaN(d)? null : d.toISOString().slice(0,10);
}
function versNombre(v){
  if(v==null||v==='') return 0;
  if(typeof v==='number') return isNaN(v)?0:v;
  let s = String(v).trim().replace(/[^\d,.\-\s]/g,'').replace(/\s/g,''); // garde chiffres, séparateurs, signe
  if(!s) return 0;
  const virg = s.lastIndexOf(','), pt = s.lastIndexOf('.');
  // Le dernier séparateur n'est "décimal" que s'il reste 1 ou 2 chiffres après lui ; sinon c'est un séparateur de milliers.
  const sep = Math.max(virg, pt);
  if(sep >= 0){
    const apres = s.length - sep - 1;
    if(apres >= 1 && apres <= 2 && (s.match(/[.,]/g)||[]).length === 1 && !/[.,]\d{3}$/.test(s)){
      // un seul séparateur, 1-2 chiffres après : décimal réel (ex. 2500,5 / 2500.50)
      s = s.slice(0,sep).replace(/[.,]/g,'') + '.' + s.slice(sep+1);
    } else {
      // séparateur(s) de milliers : on les retire tous (ex. 10.000 / 10 000 / 1.000.000)
      s = s.replace(/[.,]/g,'');
    }
  }
  const n = parseFloat(s); return isNaN(n)?0:n;
}
function versBool(v){ return /^(1|oui|yes|vrai|true|x|o)$/i.test(String(v||'').trim()); }
function devineFonction(txt, cat){
  const n = norm(txt);
  if(cat===3) return 'mutualiste';
  if(!n) return 'personnel';
  // Dirigeants supérieurs (tester AVANT le président, car "vice-président" contient "président")
  if(/vice.?president|president.*conseil.*surveillance|president.*conseil.*honoraire|president.*cs\b|president.*ch\b|directeur general|directeur gen|\bdga\b|\bdg\b/.test(n)) return 'dirigeant';
  // Président du Conseil d'Administration (capital le plus élevé) — sans "vice"
  if(/president.*conseil.*administration|\bpca\b|\bpresident du ca\b|^president$/.test(n)) return 'pca';
  // Élus et membres des conseils (administrateur, CS, honoraire…) — NE DOIVENT PAS devenir "personnel"
  if(/administrateur|membre.*conseil|conseil.*surveillance|conseil.*administration|conseil.*honoraire|surveillance|honoraire|\belu\b|\belus\b|censeur|commissaire|directeur mufid|directeur de/.test(n)) return 'elu';
  // Personnel salarié
  if(/agent|caissier|comptable|salarie|personnel|employe|guichet|\bchef\b|secretaire|cadre|gestionnaire|charge de/.test(n)) return 'personnel';
  return 'personnel';
}
/* Lecture souple de la catégorie : accepte 1/2/3, "Cat 1", "C1", "catégorie 2", "institutionnel", "mutualiste"… */
function lireCategorie(v){
  const n = norm(v); if(!n) return 0;
  let m = n.match(/\b([123])\b/) || n.match(/\b(?:c|cat|categorie|classe)\s*0*([123])\b/);
  if(m) return +m[1];
  if(/mutualiste|physique|morale|coop/.test(n)) return 3;
  if(/retrait/.test(n)) return 2;
  if(/actif|institutionnel|elu|personnel|salarie/.test(n)) return 1;
  return 0;
}
/* Retrouve ou crée une MUFID à partir du libellé du fichier, en conservant le NOM LITTÉRAL.
   Le code court (interne) est dérivé proprement, le nom affiché reste complet (ex. « Bandenkop »). */
function resoudreMufid(libelle){
  const lib = String(libelle||'').trim(); if(!lib) return '';
  const n = norm(lib);
  // déjà connue ? (par nom ou par code)
  const ex = DB.mufids.find(m => norm(m.nom)===n || norm(m.code)===n || norm(m.nom).includes(n) || n.includes(norm(m.nom)));
  if(ex) return ex.code;
  // nouveau code court lisible, nom = libellé complet mis en forme
  let code = lib.replace(/^mufid\s+/i,'').trim().slice(0,10).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!code) code = 'MUF'+(DB.mufids.length+1);
  let base=code, i=2; while(DB.mufids.find(m=>m.code===code)){ code=base+i; i++; }
  const nomPropre = /^mufid/i.test(lib)? lib : 'MUFID '+lib.charAt(0).toUpperCase()+lib.slice(1).toLowerCase();
  DB.mufids.push({code, nom:nomPropre});
  return code;
}

function compteurDepart(code){
  let max = 0;
  DB.adherents.forEach(a=>{ if(a.mufid===code && a.matricule){ const m=String(a.matricule).match(/(\d+)\s*$/); if(m) max=Math.max(max,+m[1]); } });

  return max;
}

      mufid = ex? ex.code : resoudreMufid(val(r,'mufid'));
    }
    const fonction = val(r,'fonction');
    const role = devineRoleComite(fonction);
    const nom = val(r,'nom');
    const a = { id:'c'+hash32(norm(mufid+'|'+nom+'|'+val(r,'cni'))), mufid, nom, fonction,
      role, cni:val(r,'cni'), telephone:val(r,'telephone'), ligne:idx+2, erreurs:[], avis:[] };
    if(!nom) a.erreurs.push('Nom manquant');
    if(!mufid) a.avis.push('MUFID non renseignée');
    if(!role) a.avis.push('Rôle non reconnu depuis la fonction — à préciser');
    return a;
  });
}

        <th class="nc n">Capital</th><th class="nc n">Cotisation</th><th class="nc">Traitement</th><th class="nc">Observations</th></tr></thead><tbody>
        ${l.slice(0,250).map((a,i)=>`<tr data-i="${i}"><td class="disc">${a.ligne}</td><td class="disc">${esc(a.matricule||'')}</td><td>${esc(R.nomComplet(a))||'<span class="disc">—</span>'}</td>
          <td><select data-cat="${i}" style="padding:2px 4px">${[1,2,3].map(c=>`<option value="${c}" ${a.categorie===c?'selected':''}>${CATEGORIES[c].court}</option>`).join('')}</select></td>
          <td>${a.categorie===3?'<span class="disc">Mutualiste</span>':`<select data-fonc="${i}" style="padding:2px 4px">${Object.entries(FONCTIONS).filter(([k])=>k!=='mutualiste').map(([k,fo])=>`<option value="${k}" ${a.fonction===k?'selected':''}>${fo.lib.length>34?fo.lib.slice(0,34)+'…':fo.lib}</option>`).join('')}</select>`}</td>

    verifierImportDepuis(l); });

    if(!valides.length){ toast('Aucune ligne valide à importer','ko'); return; }
    const sync = $('#dSync') && $('#dSync').checked;
    // MUFID concernée(s) par le fichier (pour la synchronisation)
    const mufidsFichier = [...new Set(valides.map(a=>a.mufid).filter(Boolean))];

    if(Srv.actif()){
      $('#impGo').disabled = true;
      $('#impVerif').insertAdjacentHTML('beforeend', `<div class="bloc" id="impProg"><div class="corps">

      const prog=(fait,tot,lib)=>{ const p=Math.round(fait/Math.max(1,tot)*100); const b=document.getElementById('impProgBar'),t=document.getElementById('impProgTxt');
        if(b) b.style.width=p+'%'; if(t) t.textContent=`${lib||''} ${nb(fait)} / ${nb(tot)} (${p} %)`; };
      try{
        await Cloud.pushMeta(DB);
        // 1) Synchronisation : calculer les absents AVANT d'écrire (sans rien supprimer encore)
        let aRetirer=[];
        if(sync){
          const idsFichier=new Set(valides.map(a=>a.id));
          for(const code of mufidsFichier){
            const idsBase=await Srv.idsMufid(code);
            idsBase.forEach(id=>{ if(!idsFichier.has(id)) aRetirer.push(id); });
          }
        }
        // 2) Écrire le fichier (upsert : met à jour + ajoute) — la base n'est jamais vide
        await Srv.upsertLot(valides, (fait,tot)=>prog(fait,tot,'Intégration'));
        // 3) Retirer les absents seulement après un upsert réussi
        if(sync && aRetirer.length) await Srv.supprimerLot(aRetirer,(fait,tot)=>prog(fait,tot,'Retrait des absents'));
        journal('Import de membres (serveur)', `${IMP.nom} — ${valides.length} lignes${sync?`, ${aRetirer.length} retiré(s)`:''}`);
        await Cloud.auditer('Import MUFID', `${IMP.nom} — ${valides.length} intégrés${sync?`, ${aRetirer.length} retirés`:''}`);
        toast(`${nb(valides.length)} adhérents intégrés${sync&&aRetirer.length?` · ${nb(aRetirer.length)} retirés`:''}`,'ok');
        IMP=null; await rafraichir(); aller('adherents');
      }catch(e){ toast('Échec de l’import serveur : '+(e.message||e),'ko'); $('#impGo').disabled=false; }
      return;
    }
    // Mode local
    let c=0,m=0; const idx={}; DB.adherents.forEach(a=>idx[a.id]=a);
    const idsFichier=new Set(valides.map(a=>a.id));
    valides.forEach(a=>{ if(idx[a.id]){ const cot=idx[a.id].cot||{}; Object.assign(idx[a.id], a, {cot:Object.assign({},cot,a.cot)}); m++; }
      else { idx[a.id]=a; DB.adherents.push(a); c++; } });
    let retires=0;
    if(sync){ const avant=DB.adherents.length;
      DB.adherents=DB.adherents.filter(a=> !mufidsFichier.includes(a.mufid) || idsFichier.has(a.id));
      retires=avant-DB.adherents.length; }
    journal('Import de membres', `${IMP.nom} — ${c} création(s), ${m} mise(s) à jour${sync?`, ${retires} retiré(s)`:''}`);
    sauver(true); toast(`${c} créé(s), ${m} mis à jour${sync?` · ${retires} retiré(s)`:''}`,'ok'); IMP=null; aller('adherents');
  };
}

function feuille(wb, nom, lignes){ const ws = XLSX.utils.aoa_to_sheet(lignes);
  ws['!cols'] = (lignes[0]||[]).map((_,i)=>({wch: Math.min(38, Math.max(10, ...lignes.slice(0,80).map(r=>String(r[i]==null?'':r[i]).length+2)))}));
  // Colonnes de montants : format « nombre à séparateur de milliers » (les valeurs restent additionnables)
  const entete = lignes[0]||[];
  const estMontant = h => /capital|cotisation|cotise|part |montant|appel|encaiss|pay|reste|solde|indemnit|engagement|provision|r[ée]serve/i.test(String(h||''));
  const estTaux = h => /taux|ratio|recouvrement|pourcent/i.test(String(h||''));
  const colM = entete.map((h,i)=> estMontant(h)&&!estTaux(h) ? i : -1).filter(i=>i>=0);
  const colT = entete.map((h,i)=> estTaux(h) ? i : -1).filter(i=>i>=0);
  if(colM.length || colT.length){
    const R0 = XLSX.utils.decode_range(ws['!ref']);
    for(let r=1; r<=R0.e.r; r++){
      colM.forEach(ci=>{ const ad=XLSX.utils.encode_cell({r,c:ci}); const cell=ws[ad]; if(cell && typeof cell.v==='number'){ cell.t='n'; cell.z='# ##0'; } });
      colT.forEach(ci=>{ const ad=XLSX.utils.encode_cell({r,c:ci}); const cell=ws[ad]; if(cell && typeof cell.v==='number'){ cell.t='n'; cell.z=(Math.abs(cell.v)<=1?'0.0%':'0.0'); } });
    }
  }
  XLSX.utils.book_append_sheet(wb, ws, nom.slice(0,31)); }
function classeur(nom, feuilles){ const wb = XLSX.utils.book_new(); feuilles.forEach(f=>feuille(wb,f[0],f[1]));
  XLSX.writeFile(wb, nom); toast('Fichier Excel généré','ok'); }

function docPdf(orientation){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:orientation||'p', unit:'mm', format:'a4'});
  // Nettoyage automatique de TOUT texte écrit dans le PDF (espaces spéciales, apostrophes typo, tirets longs)
  const _text = doc.text.bind(doc);
  doc.text = function(t, x, y, o){
    if(typeof t==='string') t = txtPdf(t);
    else if(Array.isArray(t)) t = t.map(x=>typeof x==='string'?txtPdf(x):x);
    return _text(t, x, y, o);
  };
  return doc;
}
function enteteDoc(doc, titre, sous){
  doc.setFillColor(16,33,46); doc.rect(0,0,doc.internal.pageSize.getWidth(),24,'F');
  doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('MUFID UNION', 12, 10);
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text('Réseau des Mutuelles Financières de Développement — Agrément N° 00000296/MINFI du 22 avril 2020', 12, 15);
  doc.text('Fonds d’Assistance Sociale (FAS-MUFID) — Siège social : Yaoundé, Cameroun', 12, 19.5);
  doc.setTextColor(16,33,46); doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(titre, 12, 34);
  if(sous){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(98,113,125); doc.text(sous, 12, 39.5); }
  doc.setTextColor(29,43,54);
  return sous? 45 : 40;
}
function piedDoc(doc){
  const n = doc.internal.getNumberOfPages(), w = doc.internal.pageSize.getWidth(), h = doc.internal.pageSize.getHeight();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setDrawColor(215,221,227); doc.line(12,h-14,w-12,h-14);
    doc.setFontSize(7.5); doc.setTextColor(98,113,125);
    doc.text('Document généré le '+new Date().toLocaleString('fr-FR')+' — Règlement Intérieur FAS-MUFID, Résolution N°25/AGM/18-12-2025', 12, h-9);
    doc.text('Page '+i+' / '+n, w-12, h-9, {align:'right'}); }
}
function tablePdf(doc, tete, corps, y, opts){
  const net = c => (c && typeof c==='object' && !Array.isArray(c)) ? Object.assign({},c,{content:txtPdf(c.content)}) : txtPdf(c);
  const teteN = (tete||[]).map(net);
  const corpsN = (corps||[]).map(r=>r.map(net));
  doc.autoTable(Object.assign({head:[teteN], body:corpsN, startY:y, theme:'grid',
    styles:{fontSize:7.8, cellPadding:1.9, lineColor:[215,221,227], textColor:[29,43,54], overflow:'linebreak'},
    headStyles:{fillColor:[19,94,151], textColor:255, fontStyle:'bold', fontSize:7.8},
    alternateRowStyles:{fillColor:[248,250,251]}}, opts||{}));
  return doc.lastAutoTable.finalY;
}
function sortiePdf(doc, nom){ doc.save(nom); toast('Document PDF généré','ok'); }

  <div class="bloc"><h2>Journal d’audit centralisé</h2><div id="uAudit" class="corps serre"><div class="vide">Chargement…</div></div></div>`;

async function chargerListeComptes(){
  try{
    const u = await Cloud.listerUtilisateurs();
    $('#uListe').innerHTML = `<div class="tab-enrob"><table class="t"><thead><tr>
      <th class="nc">Utilisateur</th><th class="nc">Rôle</th><th class="nc">État</th><th class="nc"></th></tr></thead><tbody>
      ${u.map(x=>`<tr><td><b>${esc(x.nom||'—')}</b><div class="disc">${esc(x.email)}</div></td>
        <td><span class="et ${x.role==='admin'?'inf':'neu'}">${(ROLES[x.role]||{}).lib||x.role}</span></td>
        <td>${x.actif!==false?'<span class="et ok">Actif</span>':'<span class="et ko">Désactivé</span>'}</td>
        <td><button class="btn s mini" data-edit="${x.id}">Modifier</button></td></tr>`).join('')}
      </tbody></table></div>`;
    $$('#uListe [data-edit]').forEach(b=>b.onclick=()=>formUtilisateur(u.find(x=>x.id===b.dataset.edit)));
  }catch(e){ $('#uListe').innerHTML = `<div class="note rouge">Impossible de charger les comptes : ${esc(e.message||e)}</div>`; }
}
async function chargerAudit(){
  try{
    const a = await Cloud.listerAudit(150);
    $('#uAudit').innerHTML = a.length? `<div class="tab-enrob" style="max-height:420px;overflow:auto"><table class="t"><thead><tr>
      <th class="nc">Date</th><th class="nc">Opérateur</th><th class="nc">Action</th><th class="nc">Détail</th></tr></thead><tbody>
      ${a.map(x=>`<tr><td class="disc">${new Date(x.ts).toLocaleString('fr-FR')}</td><td>${esc(x.email||'—')}</td>
        <td>${esc(x.action||'')}</td><td class="disc">${esc(x.detail||'')}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="vide">Aucune opération enregistrée</div>`;
  }catch(e){ $('#uAudit').innerHTML = `<div class="disc" style="padding:12px">Journal d’audit indisponible.</div>`; }
}
function formUtilisateur(u){
  const edit = u && u.id;
  const champRole = (sel)=>`<select id="uRole">${Object.entries(ROLES).sort((a,b)=>b[1].rang-a[1].rang).map(([k,r])=>`<option value="${k}" ${sel===k?'selected':''}>${r.lib} — ${r.desc}</option>`).join('')}</select>`;
  modale(edit?'Modifier le compte':'Activer un compte', `
    ${edit? `<div class="note"><b>${esc(u.email)}</b></div>`
      : `<div class="note"><b>Procédure sécurisée</b>L’opérateur crée d’abord son mot de passe (il se connecte une première fois à l’application, ou vous le créez dans Supabase → Authentication). Indiquez ici son e-mail pour l’activer et lui attribuer un rôle. Aucun mot de passe ne transite par cet écran.</div>
      <div class="champ"><label>Adresse e-mail du compte à activer</label><input type="text" id="uEmail" placeholder="operateur@mufidunion.com"></div>`}
    <div class="champ"><label>Nom de l’opérateur</label><input type="text" id="uNom" value="${esc(edit?(u.nom||''):'')}"></div>
    <div class="champ"><label>Rôle et privilèges</label>${champRole(edit?u.role:'lecteur')}</div>
    ${edit? `<label class="ch"><input type="checkbox" id="uActif" ${u.actif!==false?'checked':''}> Compte actif</label>`:''}
    <div class="aide" style="margin-top:10px">Les privilèges sont appliqués côté serveur (RLS) : un rôle ne peut pas être contourné depuis le navigateur.</div>`,
    [ {t:'Annuler'},
      {t:edit?'Enregistrer':'Activer le compte', cl:'', f:async ()=>{
        try{
          if(edit){ await Cloud.majUtilisateur(u.id, {nom:$('#uNom').value, role:$('#uRole').value, actif:$('#uActif').checked});
            journal('Modification compte', u.email+' → '+$('#uRole').value+($('#uActif').checked?' (actif)':' (désactivé)')); toast('Compte mis à jour','ok'); }
          else {
            const email=$('#uEmail').value.trim();
            if(!email){ toast('Adresse e-mail requise','ko'); return false; }
            await Cloud.activerUtilisateur(email, $('#uNom').value, $('#uRole').value);
            journal('Activation compte', email+' ('+$('#uRole').value+')'); toast('Compte activé','ok');
          }
          chargerListeComptes();
        }catch(e){ toast('Échec : '+(e.message||e),'ko'); return false; }
      }} ]);
}

  if($('#dSeedFusion')) $('#dSeedFusion').onclick = ()=>{ if(!AC.gardien('import')) return;

      [{t:'Annuler'},{t:'Remplacer',cl:'d',f:()=>{ chargerReprise(true); }}]); };
  $('#dDemo').onclick = ()=>{ if(!AC.gardien('demo')) return; modale('Charger la démonstration','<p>Cela remplace les données actuelles par un jeu fictif. Continuer ?</p>',

  $('#dReset').onclick = ()=>{ if(!AC.gardien('reset')) return; modale('Tout effacer',

    [{t:'Annuler'},{t:'Effacer définitivement',cl:'d',f:async ()=>{
      if(Srv.actif()){
        try{ await Srv.viderAdherents(); DB.adherents=[]; DB._modifies=[]; DB.nbAdherents=0;
          journal('Suppression de tous les adhérents',''); await Cloud.auditer('Vidage adhérents','base centrale');
          toast('Base vidée','ok'); await rafraichir(); }
        catch(e){ toast('Échec : '+(e.message||e),'ko'); }
      } else { DB=dbVide(); sauver(true); toast('Données effacées','ok'); majExercices(); aller('bord'); }
    }}]); };
  if($('#clSave')) $('#clSave').onclick = async ()=>{ const u=$('#clUrl').value, k=$('#clKey').value;
    if(!u||!k){ toast('URL et clé requises','ko'); return; } Cloud.configurer(u,k); ecranConnexion(true); };
  if($('#clSync')) $('#clSync').onclick = ()=>synchroniser();
  if($('#clPull')) $('#clPull').onclick = ()=>rafraichir();
  if($('#clOut')) $('#clOut').onclick = async ()=>{ await Cloud.logout(); toast('Déconnecté','ok'); majEtatCloud(); ecranConnexion(); };
  if($('#clSql')) $('#clSql').onclick = ()=>dl(new Blob([SCHEMA_SQL],{type:'text/plain'}), 'FAS-MUFID_schema.sql');
  if($('#clGuide')) $('#clGuide').onclick = ()=>dl(new Blob([GUIDE_MD],{type:'text/markdown'}), 'FAS-MUFID_deploiement.md');
  if($('#clRecalc')) $('#clRecalc').onclick = async ()=>{ if(!AC.gardien('parametres')) return;
    if(!Srv.actif()){ toast('Disponible en mode serveur uniquement','ko'); return; }
    const b=$('#clRecalc'); b.disabled=true; const t0=b.textContent;
    try{ const n=await Srv.recalculer((fait,tot)=>{ b.textContent=`Recalcul ${Math.round(fait/tot*100)} %`; });
      journal('Recalcul des champs dérivés', n+' adhérents'); toast(nb(n)+' adhérents recalculés','ok'); }
    catch(e){ toast('Échec du recalcul : '+(e.message||e),'ko'); }

function majEtatCloud(){

  const clEtat = {local:'neu',ok:'ok',sync:'inf',attente:'att',ko:'ko'}[Cloud.etat]||'neu';
  el.innerHTML = `<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="et ${clEtat}" style="font-size:13px;padding:3px 12px">${libEtat}</span>
      ${connecte? `<span class="disc">Projet : ${esc(Cloud.cfg.url)}</span>`:''}
    </div>
    ${connecte? `<div class="disc" style="margin-top:8px">Chaque enregistrement est poussé vers la base centrale ; le tableau de bord reflète les données de toutes les machines connectées.</div>`
      : `<div class="disc" style="margin-top:8px">Configurez la connexion ci-dessous pour centraliser les données et les partager entre les MUFID et l’Union.</div>`}`;
}

/* =====================================================================
   REPRISE DU FICHIER OFFICIEL (consolidation des cotisations payées)
   ===================================================================== */
async function decompresserSeed(){
  const bytes = Uint8Array.from(atob(SEED_B64), c=>c.charCodeAt(0));
  const flux = new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')));
  return JSON.parse(await flux.text());
}
async function chargerReprise(remplace){
  let s; try{ s = await decompresserSeed(); }catch(e){ toast('Décompression du fichier de reprise impossible','ko'); return; }
  const NOM = {}; s.m.forEach(([c,n])=>NOM[c]=n);
  const mufids = s.m.map(([c,n])=>({code:c,nom:n}));
  const ex = s.e;
  const nouveaux = s.a.map(([id,mat,nom,tel,compte,mufid,cat,fonc,paye])=>({
    id, matricule:mat, nom, prenom:'', raisonSociale:'', typePersonne:'physique', personneCouverte:'', formeMorale:'association',
    dateNaissance:null, sexe:'', cni:'', telephone:tel||'', compte:compte||'', mufid, categorie:cat, fonction:fonc,
    dateAdhesion:'2026-01-01', anneesService:0, solde:0, mouvements:0, option:false, ancienMembre:true,
    statut:'actif', ayantsDroit:[],
    cot:{ [ex]:{du:(cat===3?2500:10000), paye, date:'2026-01-31', mode:'Reprise consolidation', payeur:null} }
  }));
  if(remplace){ DB = dbVide(); DB.params.exercice = ex; }
  // fusionner les MUFID
  mufids.forEach(m=>{ if(!DB.mufids.find(x=>x.code===m.code)) DB.mufids.push(m); });
  // fusionner les adhérents (par id stable → ré-import idempotent)
  const idx = {}; DB.adherents.forEach(a=>idx[a.id]=a);
  let c=0,u=0;
  nouveaux.forEach(a=>{ if(idx[a.id]){ Object.assign(idx[a.id], a); u++; } else { DB.adherents.push(a); c++; } });
  journal('Reprise fichier cotisations', `${c} création(s), ${u} mise(s) à jour`);
  await sauver(false);
  toast(`${nb(c)} adhérents chargés, ${nb(u)} mis à jour`,'ok');
  majExercices(); aller('bord');
}

  // catégorie 1 — actifs

  // catégorie 2 — retraités
  for(let i=0;i<12;i++){ const h=Math.random()>0.5; mk({categorie:2,fonction:rnd(['elu','personnel','dirigeant']),mufid:rnd(DB.mufids).code,
    nom:rnd(noms),prenom:h?rnd(prenomsH):rnd(prenomsF),sexe:h?'M':'F',dateNaissance:dnaiss(61,78),dateAdhesion:'2026-01-20',
    anneesService:12+Math.floor(Math.random()*18),option:Math.random()>0.6}); }
  // catégorie 3 — mutualistes physiques
  for(let i=0;i<140;i++){ const h=Math.random()>0.5, ancien=Math.random()>0.4, jeune=Math.random()>0.5;
    const adh = ancien? DB.params.dateLancement : rnd(['2026-02-10','2026-03-05','2026-04-18','2026-05-22','2026-06-30']);
    mk({categorie:3,fonction:'mutualiste',mufid:rnd(DB.mufids).code,nom:rnd(noms),prenom:h?rnd(prenomsH):rnd(prenomsF),sexe:h?'M':'F',
      dateNaissance:jeune?dnaiss(22,44):dnaiss(45,72),dateAdhesion:adh,ancienMembre:ancien,compte:'C'+Math.floor(Math.random()*1e7),
      solde:Math.random()>0.1? 2500+Math.floor(Math.random()*90000): Math.floor(Math.random()*2000),

      telephone:'6'+Math.floor(Math.random()*1e8),cni:'CNI'+Math.floor(Math.random()*1e6),_paye:Math.random()>0.12}); }
  // catégorie 3 — personnes morales
  const orgs=[['Association des Planteurs de Bandenkop','association','Fotso Jean'],['GIC Agropastoral du Noun','association','Kamga Paul'],

  // un doublon multi-comptes (art. 17)
  const cible = DB.adherents.find(a=>a.categorie===3 && a.typePersonne==='physique');
  if(cible){ mk({categorie:1,fonction:'elu',mufid:'YDE',nom:cible.nom,prenom:cible.prenom,dateNaissance:cible.dateNaissance,cni:cible.cni,dateAdhesion:'2026-01-15'}); }
  // sinistres — surtout des mutualistes (250 000) + un cas institutionnel, pour un ratio S/P instructif
  const mutu = DB.adherents.filter(a=>a.statut==='actif' && a.categorie===3 && a.typePersonne==='physique');
  const inst = DB.adherents.filter(a=>a.statut==='actif' && a.categorie!==3);
  const echantillon = [];
  [0,1,2].forEach(()=>{ const a=mutu[Math.floor(Math.random()*mutu.length)]; if(a && !echantillon.includes(a)) echantillon.push(a); });

    DB.sinistres.push(s); a.statut='decede'; });
  DB.adherents.forEach(a=>{ const c=R.cot(a); if(c&&c.paye) tresor('Cotisation 2026 — '+R.nomComplet(a),c.paye,c.date); });
  DB.params.reserveAnterieure = 0;   // le Fonds démarre sans réserve : l'actif net = cotisations − sinistres − gratification
  journal('Chargement de la démonstration', DB.adherents.length+' adhérents, '+DB.sinistres.length+' sinistres');
  sauver(true); toast('Jeu de démonstration chargé','ok'); majExercices(); aller('bord');
}

/* =====================================================================
   EXERCICES & INITIALISATION
   ===================================================================== */
function majExercices(){
  const anneeLancement = new Date(DB.params.dateLancement||'2026-01-01').getFullYear();  // le Fonds n'existe pas avant
  const cur = new Date().getFullYear();
  const ans = new Set([DB.params.exercice]);
  DB.adherents.forEach(a=>Object.keys(a.cot||{}).forEach(k=>ans.add(+k)));
  DB.sinistres.forEach(s=>ans.add(new Date(s.dateDeces).getFullYear()));
  ans.add(cur);
  // on ne propose aucune année antérieure au lancement du Fonds
  const l = Array.from(ans).filter(x=>x>=anneeLancement && x<=cur+1).sort((a,b)=>b-a);
  if(!l.length) l.push(anneeLancement);
  if(DB.params.exercice < anneeLancement) DB.params.exercice = anneeLancement;
  $('#selExercice').innerHTML = l.map(a=>`<option value="${a}" ${a===DB.params.exercice?'selected':''}>Exercice ${a}</option>`).join('');
}
$('#selExercice').onchange = e=>{ DB.params.exercice = +e.target.value; sauver(true);
  const r={bord:rendBord,adherents:rendAdherents,cotisations:rendCotisations,sinistres:rendSinistres,ratios:rendRatios,mufids:rendMufids,controle:rendControle,rapports:rendRapports}[VUE];
  if(r) r(); majPied(); };
$('#btnSauver').onclick = ()=>sauver(false);
$('#btnSauvegarde').onclick = ()=>{ aller('parametres'); setTimeout(()=>{ const b=$$('#ongParam button').find(x=>x.dataset.o==='donnees'); if(b) b.click(); },50); };

  const c = Cloud;
  $('#cxCarte').innerHTML = `

      <div class="champ"><label>URL du projet Supabase</label><input type="text" id="cxUrl" placeholder="https://xxxx.supabase.co" value="${esc(c.cfg.url)}"></div>
      <div class="champ"><label>Clé publique (anon)</label><input type="text" id="cxKey" placeholder="eyJhbGci…" value="${esc(c.cfg.key)}"></div>
      <button class="btn" id="cxConf" style="width:100%;margin-bottom:10px">Enregistrer la configuration</button>`

        <span class="lien" id="cxReconf" style="color:var(--bleu);cursor:pointer">Changer de projet</span>
      </div>`}
    <div style="border-top:1px solid var(--ligne);margin-top:16px;padding-top:14px;text-align:center">
      <span class="lien" id="cxLocal" style="color:var(--doux);cursor:pointer;font-size:12.5px">Continuer en mode local (données sur ce poste)</span>
    </div>`;
  $('#connexion').classList.add('on');
  if($('#cxConf')) $('#cxConf').onclick = ()=>{ const u=$('#cxUrl').value, k=$('#cxKey').value;
    if(!u||!k){ toast('URL et clé requises','ko'); return; } c.configurer(u,k); ecranConnexion(true); };
  if($('#cxReconf')) $('#cxReconf').onclick = ()=>{ c.cfg={url:'',key:''}; LS.set('fasmufid:cloud',c.cfg); c.client=null; ecranConnexion(true); };
  if($('#cxLogin')) $('#cxLogin').onclick = async ()=>{
    const err=$('#cxErr'); err.textContent='Connexion…';
    try{ await c.login($('#cxEmail').value.trim(), $('#cxPwd').value); await demarrerCloud(); $('#connexion').classList.remove('on'); }
    catch(e){ err.textContent = 'Échec : '+(e.message||'identifiants invalides'); }
  };
  $('#cxLocal').onclick = ()=>{ Cloud.etat='local'; majCloudChip(); $('#connexion').classList.remove('on'); };
}
async function demarrerCloud(){
  Cloud.etat='sync'; majCloudChip();
  try{
    const d = await Cloud.pull();
    if(d && (d.adherents.length || d.mufids.length)){
      DB = Object.assign(dbVide(), {mufids:d.mufids, adherents:d.adherents, sinistres:d.sinistres,
        params:Object.assign({},PARAM_DEF,d.params||{}), journal:d.journal, tresorerie:d.tresorerie, comites:d.comites||[], remboursements:d.remboursements||{}});
    } else {
      // base cloud vide : on y pousse l'état local courant pour l'initialiser
      await Cloud.push(DB);
    }
    if(!DB.mufids.length) DB.mufids=[{code:'YDE',nom:'MUFID Yaoundé'}];
    await Store.ecrire(DB); Cloud.etat='ok';
  }catch(e){ Cloud.etat='ko'; toast('Chargement cloud impossible : '+(e.message||e),'ko'); }
  majCloudChip(); majExercices(); aller('bord'); majPied();
}

async function init(){
  const chargee = await Store.lire();          // 1) cache local instantané
  DB = chargee ? Object.assign(dbVide(), chargee) : dbVide();
  DB.params = Object.assign({}, PARAM_DEF, DB.params||{});
  if(!DB.mufids.length) DB.mufids = [{code:'YDE',nom:'MUFID Yaoundé'}];
  majNav(); majExercices(); aller('bord'); majPied();

  // 2) cloud : si configuré, on tente d'ouvrir la session existante puis on synchronise
  if(Cloud.dispo()){
    Cloud.init();
    const s = await Cloud.session_();
    if(s){ await demarrerCloud(); }        // session valide → données centrales
    else { ecranConnexion(); }             // configuré mais non connecté → écran de connexion
  } else {
    majCloudChip();
    if(!DB.adherents.length){
      setTimeout(()=>{ const el = document.querySelector('#v-bord');
        if(el && VUE==='bord'){ el.insertAdjacentHTML('afterbegin', `<div class="note vert" style="margin-bottom:18px"><b>Bienvenue dans la gestion du FAS-MUFID</b>
          Pour un usage partagé en ligne, configurez la connexion cloud dans « Paramètres → Cloud & déploiement ». Sinon, importez votre fichier de membres ou chargez la démonstration.</div>`); }
      }, 60);
    }
  }
}
const chipEl = document.getElementById('cloudChip');
if(chipEl) chipEl.onclick = ()=>{ if(Cloud.session){ aller('parametres'); setTimeout(()=>{ const b=$$('#ongParam button').find(x=>x.dataset.o==='cloud'); if(b) b.click(); },50); } else ecranConnexion(); };
init();
})();
